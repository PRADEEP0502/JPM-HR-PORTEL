# Builds the backend jar whenever backend code is pushed to main and publishes it on the "backend-latest" release,
# so the office PC can install or update the server with scripts/windows/update-hrms.ps1 (no build tools needed there).
# The jar holds no secrets: every password and key lives in the PC's config\application.properties.
name: Backend jar

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-jar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B -q package -DskipTests
      - name: Publish on the backend-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp backend/target/hrms-backend-1.0.0.jar hrms-backend.jar
          echo "${GITHUB_SHA}" > hrms-backend.version.txt
          if ! gh release view backend-latest >/dev/null 2>&1; then
            gh release create backend-latest --target "${GITHUB_SHA}" --title "Backend server (latest main)" \
              --notes "Built automatically from main. On the office PC run scripts\\windows\\update-hrms.ps1 to install it." --latest=false
          fi
          gh release upload backend-latest hrms-backend.jar hrms-backend.version.txt --clobber
