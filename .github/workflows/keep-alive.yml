# Pings the Render backend's health endpoint (run it by hand from the Actions tab).
# The schedule is OFF on purpose: the backend now runs on the office PC (docs/SELF-HOSTING-WINDOWS.md) and Render is
# only a backup. Pinging Render every 10 minutes kept it awake around the clock, used up Render's ~750 free hours a
# month for the whole workspace, and got every service in it suspended. To keep Render awake again, restore:
#   schedule:
#     - cron: "*/10 0-15 * * *"     # UTC; 05:30-21:30 India time, so it may sleep at night
name: Keep backend awake

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://jpm-hr-portel.onrender.com/actuator/health) || true
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Backend did not answer with 200"
