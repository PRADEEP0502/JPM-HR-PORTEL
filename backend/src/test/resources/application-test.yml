# Test profile. A real MongoDB server (embedded, temporary data) is started once per test run.
spring:
  mail:
    # GreenMail in-process SMTP server (see CommunicationApiTest)
    host: localhost
    port: 3025
    username:
    password:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
app:
  demo-mode: false
  embedded-mongo:
    enabled: true
    data-dir:
    port: 0
  upload-dir: ./target/test-uploads
  document-encryption-key: ZTVOGCquZCPUT4HsFbLLMYK119bzeJAdvmqlOhYFVFM=
  mail:
    from-address: hr@jpm.test
    from-name: JPM HR Department
  security:
    bootstrap-admin-username: admin
    bootstrap-admin-password: Admin@12345
    # the whole test run signs in from 127.0.0.1; LoginRateLimitTest checks the limit with its own address
    login-attempts-per-ip: 100000
  google:
    credentials-file:
    spreadsheet-id: TEST_SHEET_ID_1234567890abcdef
